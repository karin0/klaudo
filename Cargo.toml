[package]
name = 'klaude'
version = '0.1.0'
edition = '2024'
rust-version = '1.89'

[dependencies]
dotenvy = '0.15.7'
serde = { version = '1.0.229', features = ['derive'] }
serde_json = '1.0.151'
ureq = { version = '3.4.0', features = ['json'] }

[lints.rust]
warnings = 'deny'

[lints.clippy]
pedantic = { level = 'warn', priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
