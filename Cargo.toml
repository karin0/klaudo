[package]
name = 'klaude'
version = '0.1.0'
edition = '2024'

[dependencies]
clap = { version = '4.6.7', default-features = false, features = ['std', 'derive', 'help', 'usage', 'error-context'] }
dotenvy = '0.15.7'
libc = '0.2.189'
serde = { version = '1.0.229', features = ['derive'] }
serde_json = '1.0.151'
ureq = { version = '3.4.0', features = ['json', 'multipart'] }

[lints.rust]
warnings = 'deny'

[lints.clippy]
pedantic = { level = 'warn', priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
