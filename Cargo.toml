[package]
name = 'klaudo'
version = '0.1.0'
edition = '2024'

[dependencies]
base64 = '0.23.1'
clap = { version = '4.6.7', default-features = false, features = ['std', 'derive', 'help', 'usage', 'error-context'] }
dotenvy = '0.15.7'
form_urlencoded = '1.2.2'
http-body-util = '0.1.5'
hyper = { version = '1.12.0', features = ['server', 'http1'] }
hyper-util = { version = '0.1.21', features = ['tokio'] }
kuriero = { git = 'https://github.com/karin0/kuriero.git', branch = 'main' }
libc = '0.2.189'
pulldown-cmark = { version = '0.13.4', default-features = false }
ring = '0.17.14'
serde = { version = '1.0.229', features = ['derive'] }
serde_json = '1.0.151'
similar = { version = '3.2.0', default-features = false, features = ['std'] }
syntect = { version = '5.3.0', default-features = false, features = ['parsing', 'regex-fancy'] }
tokio = { version = '1.54.1', features = ['rt', 'net', 'time', 'sync'] }
two-face = { version = '0.5.2', default-features = false, features = ['syntect-fancy'] }
ureq = { version = '3.4.2', features = ['multipart'] }

[dev-dependencies]
httparse = '1.10.1'
tempfile = '3.27.0'

[lints.rust]
warnings = 'deny'

[lints.clippy]
pedantic = { level = 'warn', priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
